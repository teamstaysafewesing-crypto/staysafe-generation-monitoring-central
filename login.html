<html lang="id">
<head>

    <title>Login GMC</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            border: 3px solid #ffd700;
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            background-color: #000000;
        }
        h2 {
            color: #ffd700;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn {
            background-color: #ffd700;
            color: #000000;
            padding: 12px;
            width: 100%;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #e5c100;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #ffd700;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

        <h2>GMC<br><span style="font-size: 1rem; color: #fff;">Login Monitoring Central</span></h2>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan Username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan Password" required>
            </div>
            
            <button type="submit" class="btn">Login</button>
        </form>

    </div>
